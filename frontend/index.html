<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sollertia — Autonomous Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#0e1219; --line:#232a37;
  --txt:#e8ecf4; --mut:#8a93a6; --acc:#7c5cff; --acc2:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d1119,#0b0e14)}
#logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px #7c5cff55}
#brand b{font-size:16px;letter-spacing:.06em}
#brand span{display:block;font-size:10px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}
#state{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--mut)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}
#dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}
#dot.think{background:var(--acc2);box-shadow:0 0 10px var(--acc2);animation:pulse .8s infinite}
#dot.stop{background:var(--bad)}
@keyframes pulse{50%{opacity:.4}}
button{font-family:var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;transition:.15s}
button:hover{border-color:var(--acc);transform:translateY(-1px)}
#run{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff}
#stop{border-color:#3a2430;color:var(--bad)}
#main{flex:1;display:flex;min-height:0}
#left{width:400px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel2)}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#composer{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font-size:13px;font-family:var(--sans)}
textarea{resize:none;height:56px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
#adv{display:none;gap:8px}
#adv.open{display:flex}
#plan{padding:14px;border-bottom:1px solid var(--line);max-height:200px;overflow-y:auto;display:none}
#plan.visible{display:block}
#plan h3{font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#planSteps{display:flex;flex-direction:column;gap:6px}
.planStep{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:6px;border-radius:6px;background:var(--panel)}
.planStep .num{font-family:var(--mono);color:var(--mut);font-weight:600;min-width:20px}
.planStep .text{flex:1;color:var(--txt)}
.planStep.pending .num{color:var(--mut)}
.planStep.in_progress{border-left:2px solid var(--acc2);background:var(--panel2)}
.planStep.in_progress .num{color:var(--acc2)}
.planStep.completed{border-left:2px solid var(--ok);background:rgba(52,211,153,0.05)}
.planStep.completed .num{color:var(--ok)}
.planStep.completed .text{text-decoration:line-through;color:var(--mut)}
#progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
#progressBar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;transition:width .3s}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ev{border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;animation:in .25s ease;background:var(--panel)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ev .t{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
.ev.thought{border-left-color:var(--acc2)} .ev.action{border-left-color:var(--ok)}
.ev.obs{border-left-color:#3a4152;color:var(--mut)} .ev.final{border-left-color:var(--acc);background:#171329}
.ev.error{border-left-color:var(--bad)} .ev.approve{border-left-color:var(--warn)}
.ev.plan{border-left-color:var(--acc);background:rgba(124,92,255,0.05)}
#console{display:none;border-top:1px solid var(--line);padding:10px;background:#0a0d12}
#console.open{display:block}
#console input{width:100%;font-family:var(--mono);font-size:12px}
#chrome{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#lights{display:flex;gap:6px}
#lights i{width:11px;height:11px;border-radius:50%}
#url{flex:1;font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;white-space:nowrap;overflow:hidden}
#screen{flex:1;position:relative;background:#000;display:grid;place-items:center;overflow:hidden}
#screen img{max-width:100%;max-height:100%;transition:opacity .3s}
#status{display:flex;gap:18px;padding:8px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--panel)}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9}
#modal.open{display:grid}
#modal .box{width:420px;background:var(--panel);border:1px solid var(--warn);border-radius:14px;padding:18px}
#modal h3{color:var(--warn);font-size:14px;margin-bottom:8px}
#modal pre{font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--panel2);padding:10px;border-radius:8px;overflow:auto;margin-bottom:14px;max-height:200px}
</style></head>
<body>
<div id="top">
  <div id="logo">S</div>
  <div id="brand"><b>SOLLERTIA</b><span>autonomous agent</span></div>
  <div id="state"><span id="dot"></span><span id="stateTxt">idle</span></div>
  <button onclick="exportReport()">⬇ Export</button>
  <button onclick="toggleReplay()">▶ Replay</button>
  <button id="takeBtn" onclick="toggleTake()">🎮 Take Control</button>
  <button id="stop" onclick="send({type:'stop'})">⏹ Stop</button>
  <button id="run" onclick="start()">▶ Run</button>
</div>
<div id="main">
  <div id="left">
    <div id="composer">
      <div class="row">
        <select id="provider"><option value="openrouter">OpenRouter</option><option value="gemini">Gemini</option></select>
        <input id="model" placeholder="model e.g. google/gemini-2.5-flash" style="flex:1">
        <button onclick="adv.classList.toggle('open')">⚙</button>
      </div>
      <div class="row" id="adv"><input id="apiKey" type="password" placeholder="API key (kept in memory only)" style="flex:1"></div>
      <textarea id="task" placeholder="Give Sollertia a mission..."></textarea>
    </div>
    <div id="plan">
      <h3>📋 Plan <span id="planProgress" style="margin-left:auto;color:var(--acc2)">0%</span></h3>
      <div id="planSteps"></div>
      <div id="progress"><div id="progressBar"></div></div>
    </div>
    <div id="log"></div>
    <div id="console"><input id="cmd" placeholder="manual: goto <url> | click <sel> | type <sel> <text> | shot | back" onkeydown="if(event.key==='Enter')manual()"></div>
  </div>
  <div id="right">
    <div id="chrome"><div id="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div id="url">about:blank</div></div>
    <div id="screen"><span style="color:#333">live screen</span></div>
    <div id="status"><span id="stSteps">steps 0</span><span id="stMode">mode: auto</span><span id="stCost">$0.0000</span><span id="stPing">ws: —</span></div>
  </div>
</div>
<div id="modal"><div class="box"><h3>⚠ Sollertia requests an action</h3><pre id="mTxt"></pre>
  <div class="row"><button onclick="approve(true)" style="border-color:var(--ok);color:var(--ok)">Approve</button>
  <button onclick="approve(false)" style="border-color:var(--bad);color:var(--bad)">Reject</button></div></div></div>
<script>
let ws,steps=0,currentPlan=[],lastReport="",replayData=null,replayIdx=0,replayTimer=null;
const $=id=>document.getElementById(id);
function state(s,cls){$('stateTxt').textContent=s;$('dot').className=cls||'';}
function ev(html,cls){const d=document.createElement('div');d.className='ev '+cls;
  d.innerHTML='<span class="t">'+cls+'</span>'+html;$('log').appendChild(d);$('log').scrollTop=1e9;}
function updatePlan(plan,progress){
  if(!plan||!plan.length)return;
  $('plan').classList.add('visible');
  currentPlan=plan;
  $('planSteps').innerHTML=plan.map(s=>{
    let cls=s.status||'pending';
    return '<div class="planStep '+cls+'"><span class="num">'+s.step+'</span><span class="text">'+s.action+'</span></div>';
  }).join('');
  if(progress!==undefined){
    $('progressBar').style.width=progress+'%';
    $('planProgress').textContent=Math.round(progress)+'%';
  }
}
function exportReport(){
  if(!lastReport){alert("No report yet. Run a task first.");return;}
  const blob=new Blob([lastReport],{type:"text/markdown"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="sollertia-report.md";a.click();
}
function toggleReplay(){
  if(!replayData){alert("No session recorded yet.");return;}
  $('log').innerHTML="";replayIdx=0;
  const evs=replayData.events;
  clearInterval(replayTimer);
  replayTimer=setInterval(()=>{
    if(replayIdx>=evs.length){clearInterval(replayTimer);ev('▶ Replay complete','final');return;}
    const e=evs[replayIdx++];
    if(e.type)handle(e);
  },400);
}
function start(){
  ws=new WebSocket('ws://'+location.host+'/ws');steps=0;replayData=null;
  ws.onopen=()=>{$('stPing').textContent='ws: live';state('running','live');
    ws.send(JSON.stringify({type:'task',task:task.value,provider:provider.value,apiKey:apiKey.value,model:model.value||'google/gemini-2.5-flash'}));};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function send(o){if(ws)ws.send(JSON.stringify(o));}
function handle(e){
  if(e.type==='thought'){state('thinking','think');ev(e.content,'thought');}
  if(e.type==='action'){state('acting: '+e.action,'live');steps++;$('stSteps').textContent='steps '+steps;ev('🛠 '+e.action+' '+JSON.stringify(e.args),'action');if(e.plan)updatePlan(e.plan);}
  if(e.type==='observation')ev(e.content,'obs');
  if(e.type==='url')$('url').textContent=e.url;
  if(e.type==='screenshot'){const i=new Image();i.src='data:image/png;base64,'+e.data;$('screen').innerHTML='';$('screen').appendChild(i);}
  if(e.type==='plan'){updatePlan(e.plan);ev('📋 Plan created','plan');}
  if(e.type==='plan_update'){updatePlan(e.plan,e.progress);ev('📊 Progress: '+Math.round(e.progress)+'%','plan');}
  if(e.type==='final'){state('done','live');ev('✅ '+e.content,'final');if(e.plan)updatePlan(e.plan,100);}
  if(e.type==='stopped'){state('stopped','stop');ev('⏹ stopped','error');}
  if(e.type==='error'){state('error','stop');ev('⚠ '+e.content,'error');}
  if(e.type==='approval_request'){$('mTxt').textContent=e.action+' '+JSON.stringify(e.args);$('modal').classList.add('open');state('awaiting approval','think');}
  if(e.type==='report'){lastReport=e.markdown;ev('📄 Report ready — click ⬇ Export','final');}
  if(e.type==='cost'){$('stCost').textContent='$'+(+e.usd).toFixed(4);}
  if(e.type==='session_summary'){replayData={events:[]};}
}
function approve(ok){send({type:'approve',approved:ok});$('modal').classList.remove('open');}
function toggleTake(){const on=$('console').classList.toggle('open');$('stMode').textContent='mode: '+(on?'manual':'auto');send({type:'approval_mode',on});}
function manual(){send({type:'manual',cmd:cmd.value});cmd.value='';}
</script></body></html>
